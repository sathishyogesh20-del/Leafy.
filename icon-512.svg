<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38a169"/>
      <stop offset="100%" stop-color="#22543d"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48bb78"/>
      <stop offset="100%" stop-color="#2f855a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Scanner Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8" stroke-dasharray="24 16"/>
  
  <!-- Stylized Monstera / Tropical Leaf Icon -->
  <g filter="url(#shadow)" transform="translate(256,256) scale(1.1) translate(-256,-256)">
    <path d="M256 90 C340 90 410 160 410 260 C410 360 320 420 256 420 C192 420 102 360 102 260 C102 160 172 90 256 90 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M256 120 C240 180 240 340 256 400" stroke="#2f855a" stroke-width="12" stroke-linecap="round"/>
    <path d="M250 200 C200 180 150 190 125 210" stroke="#2f855a" stroke-width="10" stroke-linecap="round"/>
    <path d="M262 230 C310 210 360 220 385 240" stroke="#2f855a" stroke-width="10" stroke-linecap="round"/>
    <path d="M250 270 C190 260 145 280 130 310" stroke="#2f855a" stroke-width="10" stroke-linecap="round"/>
    <path d="M262 300 C320 290 365 310 380 340" stroke="#2f855a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Viewfinder corners -->
  <path d="M120 170 L120 120 L170 120" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M342 120 L392 120 L392 170" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 342 L120 392 L170 392" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M392 342 L392 392 L342 392" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
