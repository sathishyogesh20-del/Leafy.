<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Apple-style continuous smooth gradient background -->
    <radialGradient id="iosGlow" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="85%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    
    <!-- 3D Glass Specular Sheen -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Inner 3D Leaf Gradient -->
    <linearGradient id="leaf3D" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Deep Drop Shadow -->
    <filter id="appleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#022c22" flood-opacity="0.45"/>
    </filter>
    
    <!-- Floating Laser Glow Filter -->
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- iOS Squircle Shape (Apple Superellipse approximation) -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#iosGlow)"/>
  
  <!-- Glass Reflection Overlay -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#glassSheen)"/>
  
  <!-- Subtle Internal Border -->
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Futuristic Viewfinder Reticle Corners -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Top-Left -->
    <path d="M 120 170 L 120 130 A 10 10 0 0 1 130 120 L 170 120"/>
    <!-- Top-Right -->
    <path d="M 342 120 L 382 120 A 10 10 0 0 1 392 130 L 392 170"/>
    <!-- Bottom-Left -->
    <path d="M 120 342 L 120 382 A 10 10 0 0 0 130 392 L 170 392"/>
    <!-- Bottom-Right -->
    <path d="M 392 342 L 392 382 A 10 10 0 0 1 382 392 L 342 392"/>
  </g>

  <!-- Floating 3D Leaf Core with Shadow -->
  <g filter="url(#appleShadow)">
    <!-- Monstera / Tropical Leaf Shape -->
    <path d="M 256 128 C 330 128 375 190 375 270 C 375 350 305 388 256 392 C 207 388 137 350 137 270 C 137 190 182 128 256 128 Z" fill="url(#leaf3D)"/>
    
    <!-- Botanical Center Rib -->
    <path d="M 256 150 C 252 230 252 320 256 375" stroke="#059669" stroke-width="9" stroke-linecap="round"/>
    
    <!-- Leaf Cuts / Side Veins -->
    <path d="M 256 210 C 210 190 175 200 155 220" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
    <path d="M 256 235 C 302 215 337 225 357 245" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
    <path d="M 256 275 C 200 265 170 285 156 310" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
    <path d="M 256 295 C 312 285 342 305 356 330" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- AI Luminous Emerald Scanner Beam (Signature Apple Intelligence Style) -->
  <g filter="url(#laserGlow)">
    <line x1="100" y1="256" x2="412" y2="256" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
    <line x1="160" y1="256" x2="352" y2="256" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>